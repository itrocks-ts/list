<!DOCTYPE html>
<html lang="en">
<head>
	<link href="../../action-bar/action.css" rel="stylesheet">
	<link href="../../ux-core/css/app.css" rel="stylesheet">
	<link href="../../ux-core/css/article.css" rel="stylesheet">
	<link href="../list.css" rel="stylesheet">
	<meta charset="utf-8">
	<script src="../build.js" type="module"></script>
	<title>{type.@output.ucFirst} list</title>
</head>
<body>
<main>
<!--BEGIN-->

	<!--#main-->
	<article data-action="list" data-class="{type.name}" data-route="{type.@route}" data-property-root="{?root}"
		data-selector-key="{?selectorKey}" data-selector-bootstrap="{?selectorBootstrap}">
		<!--view-->{{template}}<!--end-->
		<header>
			<h2>{type.@output.ucFirst} list</h2>
			<div class="list-toolbar">
				<ul class="general actions">
					<!--generalActions-->
					<li class="{action}">{{template}}</li>
					<!--end-->
				</ul>
				<div class="list-filter">
					<!--filterBar-->{{template}}<!--end-->
				</div>
				<span class="summary">{count} elements</span>
				<button class="add-column" hidden type="button" aria-label="Add column">+</button>
			</div>
		</header>
		<form action="app://(type.@route)/list" autocomplete="off" data-focus-column="{focusColumn}"
			method="post" target="main">
			<!--filterBar--><!--formFields-->{{template}}<!--end--><!--end-->
			<table class="objects" data-link="{type.@route}">
				<thead>
					<tr class="properties">
						<th class="select" data-freeze><!--selection-->{{template}}<!--end-->
							<input class="search-submit" title="Search" type="submit" value="Search">
						</th>
						<!--columns-->
						<th data-property="{name}" data-reverse="{?reverse}" data-sort="{?sort}"
							data-sortable="{sortable}">{label}
							<input aria-label="Filter {label}" data-property-filter="{name}" name="search.{field}" value="{escapedSearch}">
						</th>
						<!--end-->
					</tr>
				</thead>
				<tbody>
					{./feed.html}
				</tbody>
			</table>
			<div class="search-menu" popover="manual" role="menu">
				<button class="search" role="menuitem" tabindex="-1" type="submit">
					Search
				</button>
				<button class="reset" name="reset" role="menuitem" tabindex="-1" type="submit" value="reset">
					Reset search filters
				</button>
			</div>
			<footer>
				<ul class="selection actions">
					<!--selection--><!--footer-->{{template}}<!--end--><!--end-->
					<!--selectionActions-->
					<li class="{action}">{{template}}</li>
					<!--end-->
					<!--selection--><!--footerSummary-->{{template}}<!--end--><!--end-->
				</ul>
			</footer>
		</form>
	</article>
	<!--#end-->

<!--END-->
</main>
</body>
</html>
